[project]
name = "meridian_quant"
version = "0.1.0"
description = "Meridian quant service: fair-value engine and market maker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.5.0",
    "solana>=0.35.0",
    "solders>=0.21.0",
    "tzdata>=2024.1",  # Timezone database for zoneinfo (CI containers don't have system tzdata)
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.112.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:anchorpy"
markers = ["asyncio"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"]  # Allow magic values in tests
