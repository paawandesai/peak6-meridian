# gitleaks configuration (AB-17, NFR-10): the default rules, plus one allowlist entry for the
# documented placeholder values in .env.example. Nothing else is exempt.
title = "Meridian gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Placeholder values in .env.example (docs/environment.md)"
condition = "AND"
paths = ['''^\.env\.example$''']
regexTarget = "line"
regexes = [
  '''=(test-[a-z0-9]+-(key|token)|sk-ant-test-placeholder|local-dev-token)$''',
]

[[allowlists]]
description = """PUBLIC RedStone signer EVM addresses (redstone-primary-prod nodes from @redstone-finance/sdk,
used for signature verification; MR !78, M2-15b). Exempts only these 5 exact addresses, only in the
deploy oracle-config source and test."""
condition = "AND"
paths = ['''^scripts/deploy/src/lib/oracle-config(\.test)?\.ts$''']
regexTarget = "line"
regexes = [
  '''0x8cdBF4FE234F106eFB28D84Ef466bBaf8616f8D9''', # keyrock-1
  '''0x8BB8F32Df04c8b654987DAaeD53D6B6091e3B774''', # altair
  '''0xdEB22f54738d54976C4c0fe5ce6d408E40d88499''', # wayfarer
  '''0x51Ce04Be4b3E32572C4Ec9135221d0691Ba7d202''', # morpheus
  '''0xDD682daEC5A90dD295d14DA4b0bec9281017b5bE''', # ciri
]

[[allowlists]]
description = """Superseded pre-rewrite commits (fake test fixtures, never on main) that CI runners
still scan through stale refs/pipelines/* refs in their reused build directories. The fixtures
were replaced on the branches; this exempts only these exact commits."""
commits = [
  "93e6a8e6710cdd2a4f14c575a29fa337183d9383", # MR !28 old head: fake KEY in market-data-server.test.ts
  "6d3fd0f3d822519e62283c574246b41296043902", # MR !27 old head: fake API keys in switchboard.test.ts
  "5eb5bbfab1b3ab4313e438057fef67e6be3fed5d", # MR !27 old head: public lookup-table address in a fixture
]

