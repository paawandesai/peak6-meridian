[workspace]
members = ["programs/meridian", "crates/meridian-book", "tests/security/program"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
# Rust shipped in the Agave 2.1 platform tools (SBF builds); keeps dependency resolution compatible.
rust-version = "1.79.0"
publish = false

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
